name: Bug report
description: Report a reproducible application, package or installer problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux X11, Linux Wayland, Android, iOS, iPadOS, macOS, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version and package filename
      placeholder: v0.7.3, LeoMiniGames-v0.7.3-Arch-x86_64.pkg.tar.zst
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, version and architecture
      placeholder: Arch Linux, x86_64, Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected / actual behavior
      description: Include whether this was a fresh install or an upgrade.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove API keys, passwords, signed download URLs and personal data.
  - type: input
    id: content
    attributes:
      label: Game/mod/theme ID and version (if applicable)
  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      options:
        - label: This worked on an older LeoMiniGames version.
