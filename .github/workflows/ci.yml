name: LeoMiniGames CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_CI_VERSION: "6.10.2"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run validators
        run: |
          python3 tools/source_guard.py
          python3 tools/validate_project.py
          python3 tools/sanity_check.py
          python3 tools/security_audit.py
          python3 tools/validate_i18n.py
          python3 tools/validate_distribution.py
          python3 tools/audit_prebuilt_binaries.py
          python3 tools/validate_v070.py
          python3 -m py_compile tools/*.py
          find tools -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  linux:
    name: Linux ${{ matrix.label }}
    needs: static-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Ubuntu-22.04-x86_64
            host: linux
            qt_arch: linux_gcc_64
          - runner: ubuntu-24.04
            label: Ubuntu-24.04-x86_64
            host: linux
            qt_arch: linux_gcc_64
          - runner: ubuntu-24.04-arm
            label: Ubuntu-24.04-arm64
            host: linux_arm64
            qt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-distro:
    name: Linux native ${{ matrix.label }}
    needs: static-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: debian:13-slim
            distro: debian
            label: Debian-13-x86_64
          - runner: ubuntu-24.04-arm
            image: debian:13-slim
            distro: debian
            label: Debian-13-arm64
          - runner: ubuntu-24.04
            image: archlinux:latest
            distro: arch
            label: Arch-x86_64
          - runner: ubuntu-24.04-arm
            image: archlinux:latest
            distro: arch
            label: Arch-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian build dependencies
        if: matrix.distro == 'debian'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential cmake ninja-build pkg-config \
            libgl-dev qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-multimedia-dev
      - name: Install Arch build dependencies
        if: matrix.distro == 'arch'
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git python base-devel cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-svg qt6-multimedia
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc-x64:
    name: Windows x86_64 (MSVC 2022)
    needs: static-validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  windows-llvm-mingw:
    name: Windows x86_64 (LLVM-MinGW)
    needs: static-validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_llvm_mingw
          modules: qtmultimedia
          tools: tools_llvm_mingw1706,qt.tools.win64_llvm_mingw1706
          aqtversion: "==3.3.*"
          cache: true
      - shell: pwsh
        run: |
          clang++ --version
          ninja --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  windows-arm64:
    name: Windows ARM64 native (MSVC 2022)
    needs: static-validation
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install native Windows ARM64 Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: windows_arm64
          arch: win64_msvc2022_arm64
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - run: cmake -S . -B build -A ARM64 -DBUILD_TESTING=OFF
      - run: cmake --build build --config Release --parallel

  macos:
    name: macOS ${{ matrix.label }}
    needs: static-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            label: x86_64
            cmake_arch: x86_64
          - runner: macos-15
            label: universal
            cmake_arch: "arm64;x86_64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  android:
    name: Android ${{ matrix.abi }}
    needs: static-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: android_arm64_v8a
            abi: arm64-v8a
          - qt_arch: android_armv7
            abi: armeabi-v7a
          - qt_arch: android_x86_64
            abi: x86_64
          - qt_arch: android_x86
            abi: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Configure Android
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
      - run: cmake --build build-android --target apk --parallel

  android-universal:
    name: Android universal multi-ABI
    needs: static-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install all Android Qt ABIs
        shell: bash
        run: |
          python3 -m pip install "aqtinstall==3.3.0"
          QT_BASE="$RUNNER_TEMP/Qt"
          for qt_arch in android_arm64_v8a android_armv7 android_x86_64 android_x86; do
            python3 -m aqt install-qt all_os android "$QT_CI_VERSION" "$qt_arch" \
              --autodesktop -m qtmultimedia -O "$QT_BASE"
          done
          echo "LMG_QT_BASE=$QT_BASE" >> "$GITHUB_ENV"
      - name: Configure multi-ABI Android
        shell: bash
        run: |
          bash "$LMG_QT_BASE/$QT_CI_VERSION/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DQT_HOST_PATH="$LMG_QT_BASE/$QT_CI_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_BUILD_ALL_ABIS=TRUE \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a;x86_64;x86"
      - run: cmake --build build-android --target apk --parallel

  apple-mobile:
    name: ${{ matrix.label }} (unsigned)
    needs: static-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS-device-arm64
            runner: macos-15
            sdk: iphoneos
            arch: arm64
            family: "1"
          - label: iOS-simulator-arm64
            runner: macos-15
            sdk: iphonesimulator
            arch: arm64
            family: "1"
          - label: iOS-simulator-x86_64
            runner: macos-15-intel
            sdk: iphonesimulator
            arch: x86_64
            family: "1"
          - label: iPadOS-device-arm64
            runner: macos-15
            sdk: iphoneos
            arch: arm64
            family: "2"
          - label: iPadOS-simulator-arm64
            runner: macos-15
            sdk: iphonesimulator
            arch: arm64
            family: "2"
          - label: iPadOS-simulator-x86_64
            runner: macos-15-intel
            sdk: iphonesimulator
            arch: x86_64
            family: "2"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt for Apple mobile
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: mac
          target: ios
          arch: ios
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Configure unsigned Apple-mobile build
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-apple -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DLEOMINIGAMES_APPLE_MOBILE_DEVICE_FAMILY=${{ matrix.family }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DBUILD_TESTING=OFF
      - run: cmake --build build-apple --config Release --parallel
