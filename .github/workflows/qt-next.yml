name: Qt 6.12 compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Qt 6.12 / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x86_64
            arch: linux_gcc_64
          - runner: windows-2022
            label: Windows x86_64
            arch: win64_msvc2022_64
          - runner: macos-15
            label: macOS arm64
            arch: clang_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt on the GitHub runner
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: "6.12.0"
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Install Qt from the split Windows MSVC repository
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python tools/ci/install_qt_next.py install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'Qt 6.12 installation failed' }
          $qtNextRoot = "$env:RUNNER_TEMP/Qt/6.12.0/msvc2022_64"
          if (!(Test-Path "$qtNextRoot/bin/Qt6Core.dll")) { throw 'Qt runtime missing' }
          "CMAKE_PREFIX_PATH=$qtNextRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT_ROOT_DIR=$qtNextRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtNextRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Run the complete native suite
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-6.12-${{ runner.os }}-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
