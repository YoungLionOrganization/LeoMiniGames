name: Linux live catalog runtime investigation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.10.2'
          modules: qtmultimedia qtimageformats
          aqtversion: '==3.3.*'
          cache: true
      - name: Install disposable runtime test services
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libxcb-cursor0 pulseaudio pulseaudio-utils fonts-dejavu-core
      - name: Build the current host and compatibility tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Real catalog themes and games at desktop and compact sizes
        run: |
          QT_QPA_PLATFORM=xcb xvfb-run -a python3 tools/ci/catalog_runtime_smoke.py \
            --app build/LeoMiniGames --output catalog-evidence
      - name: Actual effect and music output through PulseAudio
        if: always()
        run: bash tools/ci/linux_audio_smoke.sh catalog-evidence/audio "$PWD/build/LeoMiniGames"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-live-catalog-evidence
          path: |
            catalog-evidence/**/runtime.log
            catalog-evidence/**/*.png
            catalog-evidence/results.json
            catalog-evidence/audio/
          retention-days: 7
