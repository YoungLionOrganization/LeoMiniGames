name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (must match project/package metadata)"
        required: true
        default: "0.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_CI_VERSION: "6.10.2"
  LMG_VERSION: ${{ inputs.version }}
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          requested = os.environ["REQUESTED_VERSION"].strip()
          cmake = pathlib.Path("CMakeLists.txt").read_text(encoding="utf-8")
          m = re.search(r"project\(LeoMiniGames\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", cmake)
          if not m or m.group(1) != requested:
              raise SystemExit(f"workflow version {requested!r} != project version {m.group(1) if m else 'missing'}")
          PY
      - name: Validate
        run: |
          python3 tools/source_guard.py
          python3 tools/validate_project.py
          python3 tools/sanity_check.py
          python3 tools/security_audit.py
          python3 tools/validate_i18n.py
          python3 tools/validate_distribution.py
          python3 tools/audit_prebuilt_binaries.py
          python3 tools/validate_v070.py

  source:
    name: Source ZIP
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/package/package_source.py "${GITHUB_WORKSPACE}/LeoMiniGames-v${LMG_VERSION}-Source.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-source
          path: |
            LeoMiniGames-v${{ inputs.version }}-Source.zip
            LeoMiniGames-v${{ inputs.version }}-Source.zip.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x86_64 ZIP + Setup EXE
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Install Qt Installer Framework 4.11 x64
        shell: pwsh
        run: ./tools/install_qtifw_windows.ps1 -Architecture x64
      - run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        env:
          LMG_PLATFORM_SUFFIX: x86_64
        run: ./tools/package/package_windows.ps1 -BuildDir build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-windows-x86_64
          path: dist/windows/*
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 ZIP + Setup EXE
    needs: validate
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: windows_arm64
          arch: win64_msvc2022_arm64
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Install Qt Installer Framework 4.11 ARM64
        shell: pwsh
        run: ./tools/install_qtifw_windows.ps1 -Architecture arm64
      - run: |
          cmake -S . -B build -A ARM64 -DBUILD_TESTING=OFF
          cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        env:
          LMG_PLATFORM_SUFFIX: ARM64
        run: ./tools/package/package_windows.ps1 -BuildDir build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-windows-arm64
          path: dist/windows/*
          if-no-files-found: error

  linux-portable:
    name: ${{ matrix.label }} portable + AppImage
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Ubuntu-22.04-x86_64
            host: linux
            qt_arch: linux_gcc_64
            tool_arch: x86_64
          - runner: ubuntu-24.04
            label: Ubuntu-24.04-x86_64
            host: linux
            qt_arch: linux_gcc_64
            tool_arch: x86_64
          - runner: ubuntu-24.04-arm
            label: Ubuntu-24.04-arm64
            host: linux_arm64
            qt_arch: linux_gcc_arm64
            tool_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Install Linux multimedia packaging runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer-plugins-good1.0-0 libgstreamer-plugins-bad1.0-0
      - name: Install AppImage tooling
        shell: bash
        run: |
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/linuxdeploy"
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "LINUXDEPLOY_PLUGIN_QT=$RUNNER_TEMP/linuxdeploy-plugin-qt" >> "$GITHUB_ENV"
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.label }}
        run: bash tools/package/package_linux.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-${{ matrix.label }}
          path: dist/linux/*
          if-no-files-found: error

  linux-native:
    name: Native ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: debian:13-slim
            distro: debian
            label: Debian-13-x86_64
          - runner: ubuntu-24.04-arm
            image: debian:13-slim
            distro: debian
            label: Debian-13-arm64
          - runner: ubuntu-24.04
            image: archlinux:latest
            distro: arch
            label: Arch-x86_64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Debian dependencies
        if: matrix.distro == 'debian'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential cmake ninja-build pkg-config tar gzip \
            libgl-dev qt6-base-dev qt6-declarative-dev qt6-declarative-private-dev qt6-svg-dev qt6-multimedia-dev
      - name: Arch dependencies
        if: matrix.distro == 'arch'
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git python base-devel cmake ninja pkgconf tar gzip \
            qt6-base qt6-declarative qt6-svg qt6-multimedia
      - uses: actions/checkout@v7
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package native runtime
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.label }}
        run: bash tools/package/package_linux_native.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-${{ matrix.label }}-native
          path: dist/linux-native/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.label }} ZIP + DMG
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
            cmake_arch: arm64
          - runner: macos-15-intel
            label: x86_64
            cmake_arch: x86_64
          - runner: macos-15
            label: universal
            cmake_arch: "arm64;x86_64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.label }}
        run: bash tools/package/package_macos.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-macos-${{ matrix.label }}
          path: dist/macos/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }} APK + AAB
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: android_arm64_v8a
            abi: arm64-v8a
          - qt_arch: android_armv7
            abi: armeabi-v7a
          - qt_arch: android_x86_64
            abi: x86_64
          - qt_arch: android_x86
            abi: x86
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Prepare optional signing
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leominigames-upload.jks"
            chmod 600 "$RUNNER_TEMP/leominigames-upload.jks"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leominigames-upload.jks" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LMG_ANDROID_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "LMG_ANDROID_SIGNING=0" >> "$GITHUB_ENV"
            echo "Signing secrets absent: unsigned APK/AAB artifacts will still be produced."
          fi
      - name: Configure
        shell: bash
        run: |
          sign_args=()
          if [[ "$LMG_ANDROID_SIGNING" == "1" ]]; then
            sign_args+=("-DQT_ANDROID_SIGN_APK=ON" "-DQT_ANDROID_SIGN_AAB=ON")
          fi
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            "${sign_args[@]}"
      - name: Package APK + AAB
        env:
          LMG_ANDROID_ABI: ${{ matrix.abi }}
          LMG_BUILD_APK: "1"
          LMG_BUILD_AAB: "1"
        run: bash tools/package/package_android.sh build-android
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-android-${{ matrix.abi }}
          path: dist/android/*
          if-no-files-found: error

  android-universal:
    name: Android universal multi-ABI APK + AAB
    needs: validate
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install all Android Qt ABIs
        shell: bash
        run: |
          python3 -m pip install "aqtinstall==3.3.0"
          QT_BASE="$RUNNER_TEMP/Qt"
          for qt_arch in android_arm64_v8a android_armv7 android_x86_64 android_x86; do
            python3 -m aqt install-qt all_os android "$QT_CI_VERSION" "$qt_arch" \
              --autodesktop -m qtmultimedia -O "$QT_BASE"
          done
          echo "LMG_QT_BASE=$QT_BASE" >> "$GITHUB_ENV"
      - name: Prepare optional signing
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leominigames-upload.jks"
            chmod 600 "$RUNNER_TEMP/leominigames-upload.jks"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leominigames-upload.jks" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LMG_ANDROID_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "LMG_ANDROID_SIGNING=0" >> "$GITHUB_ENV"
          fi
      - name: Configure multi-ABI
        shell: bash
        run: |
          sign_args=()
          if [[ "$LMG_ANDROID_SIGNING" == "1" ]]; then
            sign_args+=("-DQT_ANDROID_SIGN_APK=ON" "-DQT_ANDROID_SIGN_AAB=ON")
          fi
          bash "$LMG_QT_BASE/$QT_CI_VERSION/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DQT_HOST_PATH="$LMG_QT_BASE/$QT_CI_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_BUILD_ALL_ABIS=TRUE \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a;x86_64;x86" \
            "${sign_args[@]}"
      - name: Package universal APK + AAB
        env:
          LMG_ANDROID_ABI: universal
          LMG_BUILD_APK: "1"
          LMG_BUILD_AAB: "1"
        run: bash tools/package/package_android.sh build-android
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-android-universal
          path: dist/android/*
          if-no-files-found: error

  apple-mobile:
    name: ${{ matrix.label }} unsigned app
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS-device-arm64
            runner: macos-15
            sdk: iphoneos
            arch: arm64
            family: "1"
            package_platform: iOS
            package_sdk: device
          - label: iOS-simulator-x86_64
            runner: macos-15-intel
            sdk: iphonesimulator
            arch: x86_64
            family: "1"
            package_platform: iOS
            package_sdk: simulator
          - label: iPadOS-device-arm64
            runner: macos-15
            sdk: iphoneos
            arch: arm64
            family: "2"
            package_platform: iPadOS
            package_sdk: device
          - label: iPadOS-simulator-x86_64
            runner: macos-15-intel
            sdk: iphonesimulator
            arch: x86_64
            family: "2"
            package_platform: iPadOS
            package_sdk: simulator
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: mac
          target: ios
          arch: ios
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true
      - name: Configure
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-apple -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DLEOMINIGAMES_APPLE_MOBILE_DEVICE_FAMILY=${{ matrix.family }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DBUILD_TESTING=OFF
      - run: cmake --build build-apple --config Release --parallel
      - name: Package unsigned app bundle
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.arch }}
          LMG_APPLE_PLATFORM: ${{ matrix.package_platform }}
          LMG_APPLE_SDK: ${{ matrix.package_sdk }}
        run: bash tools/package/package_ios.sh build-apple
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-${{ matrix.label }}-unsigned
          path: dist/ios/*
          if-no-files-found: error
