name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (must match project/package metadata)"
        required: true
        default: "0.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_CI_VERSION: "6.10.2"
  LMG_VERSION: ${{ inputs.version }}
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify requested version matches source metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, pathlib, sys
          root=pathlib.Path('.')
          requested=os.environ['REQUESTED_VERSION'].strip()
          cmake=(root/'CMakeLists.txt').read_text(encoding='utf-8')
          m=re.search(r'project\(LeoMiniGames\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', cmake)
          if not m or m.group(1) != requested:
              raise SystemExit(f"workflow version {requested!r} does not match CMake project version {m.group(1) if m else 'missing'}")
          for rel in ['installer/config/config.xml','installer/packages/xyz.younglion.leominigames/meta/package.xml']:
              text=(root/rel).read_text(encoding='utf-8')
              if f'<Version>{requested}</Version>' not in text:
                  raise SystemExit(f"{rel} does not declare version {requested}")
          print(f'Version contract OK: {requested}')
          PY
      - name: Validate
        run: |
          python3 tools/source_guard.py
          python3 tools/validate_project.py
          python3 tools/sanity_check.py
          python3 tools/security_audit.py
          python3 tools/validate_i18n.py
          python3 tools/validate_distribution.py
          python3 tools/audit_prebuilt_binaries.py
          python3 tools/validate_v070.py

  source:
    name: Source ZIP
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Package source
        run: python3 tools/package/package_source.py "${GITHUB_WORKSPACE}/LeoMiniGames-v${LMG_VERSION}-Source.zip"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v7
        with:
          path: LeoMiniGames-v${{ inputs.version }}-Source.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload source checksum
        uses: actions/upload-artifact@v7
        with:
          path: LeoMiniGames-v${{ inputs.version }}-Source.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows ZIP + Setup EXE
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install Qt Installer Framework 4.7
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==3.3.0"
          python -m aqt install-tool -O "$env:RUNNER_TEMP\QtTools" windows desktop tools_ifw qt.tools.ifw.47
          $creator = Get-ChildItem "$env:RUNNER_TEMP\QtTools" -Filter binarycreator.exe -Recurse | Select-Object -First 1
          if (-not $creator) { throw "binarycreator.exe not found after QtIFW installation" }
          "QT_IFW_BIN=$($creator.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows
        shell: pwsh
        run: ./tools/package/package_windows.ps1 -BuildDir build -Version "$env:LMG_VERSION"
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload Setup EXE
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-x86_64-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux archive + AppImage
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Install AppImage tooling
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimage-tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimage-tools/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy" "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "LINUXDEPLOY=$RUNNER_TEMP/appimage-tools/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimage-tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Package Linux
        run: ./tools/package/package_linux.sh build
      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/linux/LeoMiniGames-v${{ inputs.version }}-Linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: dist/linux/LeoMiniGames-v${{ inputs.version }}-Linux-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ZIP + DMG (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package macOS
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.arch }}
        run: ./tools/package/package_macos.sh build
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/macos/LeoMiniGames-v${{ inputs.version }}-macOS-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: dist/macos/LeoMiniGames-v${{ inputs.version }}-macOS-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android signed APK + AAB
    needs: validate
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Qt for Android arm64-v8a
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
      - name: Prepare Android signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leominigames-upload.jks"
            chmod 600 "$RUNNER_TEMP/leominigames-upload.jks"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leominigames-upload.jks" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LMG_ANDROID_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "Required Android signing secrets are missing." >&2
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD." >&2
            exit 2
          fi
      - name: Configure signed Android build
        shell: bash
        run: |
          qt-cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DQT_ANDROID_SIGN_AAB=ON
      - name: Build signed APK and AAB
        run: |
          cmake --build build-android --target apk --parallel
          cmake --build build-android --target aab --parallel
      - name: Package Android
        run: ./tools/package/package_android.sh build-android
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/android/LeoMiniGames-v${{ inputs.version }}-Android-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          path: dist/android/LeoMiniGames-v${{ inputs.version }}-Android-arm64-v8a.aab
          archive: false
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned simulator ZIP
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          target: ios
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: |
          qt-cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build-ios --config Release --parallel
      - name: Package iOS
        run: ./tools/package/package_ios.sh build-ios
      - name: Upload unsigned iOS simulator ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/ios/LeoMiniGames-v${{ inputs.version }}-iOS-unsigned-simulator.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
