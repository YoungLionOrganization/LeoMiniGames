name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (must match project/package metadata)"
        required: true
        default: "0.7.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_CI_VERSION: "6.10.2"
  LMG_VERSION: ${{ inputs.version }}
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify requested version matches source metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          root=pathlib.Path('.')
          requested=os.environ['REQUESTED_VERSION'].strip()
          cmake=(root/'CMakeLists.txt').read_text(encoding='utf-8')
          m=re.search(r'project\(LeoMiniGames\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', cmake)
          if not m or m.group(1) != requested:
              raise SystemExit(f"workflow version {requested!r} != project version {m.group(1) if m else 'missing'}")
          print(f'Version contract OK: {requested}')
          PY
      - name: Validate
        run: |
          python3 tools/source_guard.py
          python3 tools/validate_project.py
          python3 tools/sanity_check.py
          python3 tools/security_audit.py
          python3 tools/validate_i18n.py
          python3 tools/validate_distribution.py
          python3 tools/audit_prebuilt_binaries.py
          python3 tools/validate_v070.py

  source:
    name: Source ZIP
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Package source
        run: python3 tools/package/package_source.py "${GITHUB_WORKSPACE}/LeoMiniGames-v${LMG_VERSION}-Source.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-source
          path: |
            LeoMiniGames-v${{ inputs.version }}-Source.zip
            LeoMiniGames-v${{ inputs.version }}-Source.zip.sha256
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    name: Windows x86_64 ZIP + Setup EXE
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Install Qt Installer Framework 4.11
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==3.3.0"
          python -m aqt install-tool -O "$env:RUNNER_TEMP\QtTools" windows desktop tools_ifw qt.tools.ifw.411
          $creator = Get-ChildItem "$env:RUNNER_TEMP\QtTools" -Filter binarycreator.exe -Recurse | Select-Object -First 1
          if (-not $creator) { throw "binarycreator.exe not found" }
          "QT_IFW_BIN=$($creator.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure/build/test
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        env:
          LMG_PLATFORM_SUFFIX: x86_64
        run: ./tools/package/package_windows.ps1 -BuildDir build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-windows-x86_64
          path: |
            dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-x86_64.zip
            dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-x86_64-Setup.exe
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: Windows ARM64 ZIP + Setup EXE
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt ARM64 cross kit
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          arch: win64_msvc2022_arm64_cross_compiled
          modules: qtmultimedia
          cache: true
      - name: Install Qt Installer Framework 4.11
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==3.3.0"
          python -m aqt install-tool -O "$env:RUNNER_TEMP\QtTools" windows desktop tools_ifw qt.tools.ifw.411
          $creator = Get-ChildItem "$env:RUNNER_TEMP\QtTools" -Filter binarycreator.exe -Recurse | Select-Object -First 1
          if (-not $creator) { throw "binarycreator.exe not found" }
          "QT_IFW_BIN=$($creator.DirectoryName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure/build ARM64
        run: |
          cmake -S . -B build -A ARM64 -DBUILD_TESTING=OFF
          cmake --build build --config Release --parallel
      - name: Package ARM64
        shell: pwsh
        env:
          LMG_PLATFORM_SUFFIX: ARM64
        run: ./tools/package/package_windows.ps1 -BuildDir build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-windows-arm64
          path: |
            dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-ARM64.zip
            dist/windows/LeoMiniGames-v${{ inputs.version }}-Windows-ARM64-Setup.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }} archive + AppImage
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            host: linux
            qt_arch: linux_gcc_64
            tool_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            host: linux_arm64
            qt_arch: linux_gcc_arm64
            tool_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true
      - name: Install AppImage tooling
        shell: bash
        run: |
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/linuxdeploy"
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.tool_arch }}.AppImage" -o "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "LINUXDEPLOY_PLUGIN_QT=$RUNNER_TEMP/linuxdeploy-plugin-qt" >> "$GITHUB_ENV"
      - name: Configure/build/test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.arch }}
        run: ./tools/package/package_linux.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-linux-${{ matrix.arch }}
          path: |
            dist/linux/LeoMiniGames-v${{ inputs.version }}-Linux-${{ matrix.arch }}.tar.gz
            dist/linux/LeoMiniGames-v${{ inputs.version }}-Linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }} ZIP + DMG
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Configure/build/test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.arch }}
        run: ./tools/package/package_macos.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-macos-${{ matrix.arch }}
          path: |
            dist/macos/LeoMiniGames-v${{ inputs.version }}-macOS-${{ matrix.arch }}.zip
            dist/macos/LeoMiniGames-v${{ inputs.version }}-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Android signed APK (${{ matrix.abi }})
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: android_arm64_v8a
            abi: arm64-v8a
          - qt_arch: android_armv7
            abi: armeabi-v7a
          - qt_arch: android_x86_64
            abi: x86_64
          - qt_arch: android_x86
            abi: x86
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK components
        shell: bash
        run: |
          command -v sdkmanager >/dev/null
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true
      - name: Prepare Android signing
        shell: bash
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!v:-}" ]] || { echo "Missing GitHub Actions secret: $v" >&2; exit 2; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leominigames-upload.jks"
          chmod 600 "$RUNNER_TEMP/leominigames-upload.jks"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leominigames-upload.jks" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure signed Android
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_APK=ON
      - name: Build and package signed APK
        env:
          LMG_ANDROID_ABI: ${{ matrix.abi }}
          LMG_BUILD_APK: "1"
          LMG_BUILD_AAB: "0"
        run: ./tools/package/package_android.sh build-android
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-android-${{ matrix.abi }}
          path: dist/android/LeoMiniGames-v${{ inputs.version }}-Android-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 30

  android-aab:
    name: Android signed AAB (arm64-v8a)
    needs: validate
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK components
        shell: bash
        run: |
          command -v sdkmanager >/dev/null
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Qt for Android arm64-v8a
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
      - name: Prepare signing
        shell: bash
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do [[ -n "${!v:-}" ]] || exit 2; done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leominigames-upload.jks"
          chmod 600 "$RUNNER_TEMP/leominigames-upload.jks"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leominigames-upload.jks" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure signed AAB
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_SIGN_AAB=ON
      - name: Build and package signed AAB
        env:
          LMG_ANDROID_ABI: arm64-v8a
          LMG_BUILD_APK: "0"
          LMG_BUILD_AAB: "1"
        run: ./tools/package/package_android.sh build-android
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-android-aab-arm64-v8a
          path: dist/android/LeoMiniGames-v${{ inputs.version }}-Android-arm64-v8a.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator ${{ matrix.arch }} ZIP (unsigned)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_CI_VERSION }}
          target: ios
          modules: qtmultimedia
          cache: true
      - name: Configure/build
        shell: bash
        run: |
          bash "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DBUILD_TESTING=OFF
          cmake --build build-ios --config Release --parallel
      - name: Package
        env:
          LMG_PLATFORM_SUFFIX: ${{ matrix.arch }}
        run: ./tools/package/package_ios.sh build-ios
      - uses: actions/upload-artifact@v7
        with:
          name: LeoMiniGames-${{ inputs.version }}-ios-simulator-${{ matrix.arch }}
          path: dist/ios/LeoMiniGames-v${{ inputs.version }}-iOS-simulator-${{ matrix.arch }}-unsigned.zip
          if-no-files-found: error
          retention-days: 30
